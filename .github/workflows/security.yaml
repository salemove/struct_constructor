name: Snyk Elixir Security Scan

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master
  schedule:
    - cron: '39 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    uses: salemove/glia-security-workflows/.github/workflows/elixir-snyk-security-scan.yaml@master
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
